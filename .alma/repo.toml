# 仓库档案。这个仓库是什么、怎么验、agent 能不能自己合。
# 换一个 agent 也该知道的事写在这里，不写进任何人的记忆。
# 没有这个文件的仓库默认不许动。

name = "agent-setup"
nature = "unclassified"          # product | library | archive | proving-ground
verify = "unknown"          # 一条能跑的命令；写不出就留 unknown
notes = "没有 CI，没有测试命令，性质待定"

[merge]
agent_may_merge = false
requires = ["verify-exit-0", "independent-verify", "diff-in-scope"]

[comment]
agent_may_comment = true

[label]
agent_may_label = true
