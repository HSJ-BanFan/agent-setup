services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    restart: unless-stopped
    pull_policy: always
    ports:
      - "18318:8317"
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml:rw
      - ./auth:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./plugins:/CLIProxyAPI/plugins
    environment:
      - TZ=Asia/Tokyo

      # - HTTP_PROXY=http://host.docker.internal:7897
      # - HTTPS_PROXY=http://host.docker.internal:7897
      # - ALL_PROXY=http://host.docker.internal:7897
      # - NO_PROXY=127.0.0.1,localhost,::1,host.docker.internal

      # - http_proxy=http://host.docker.internal:7897
      # - https_proxy=http://host.docker.internal:7897
      # - all_proxy=http://host.docker.internal:7897
      # - no_proxy=127.0.0.1,localhost,::1,host.docker.internal

  cpa-manager:
    image: seakee/cpa-manager:latest
    container_name: cpa-manager
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    ports:
      - "18317:18317"
    volumes:
      - cpa-manager-data:/data
    environment:
      - CPA_UPSTREAM_URL=http://cli-proxy-api:8317
      - CPA_MANAGEMENT_KEY=YOUR_MANAGEMENT_KEY
      - USAGE_COLLECTOR_MODE=http

volumes:
  cpa-manager-data:
