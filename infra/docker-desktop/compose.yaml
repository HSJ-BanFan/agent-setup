name: agent-infra-desktop

x-watchtower-enabled: &watchtower-enabled
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.scope: "desktop-ai"

services:
  napcat:
    profiles: ["qq"]
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
      - "3001:3001"
      - "6099:6099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/napcat/qq:/app/.config/QQ
      - ./data/napcat/config:/napcat/config
      - ./data/napcat/app-config:/app/napcat/config

  grok2api:
    image: ghcr.io/chenyme/grok2api:latest
    container_name: grok2api
    restart: unless-stopped
    pull_policy: always
    init: true
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
    ports:
      - "21434:8000"
    volumes:
      - ./config/grok2api/config.yaml:/run/grok2api/config.yaml:ro
      - ./data/grok2api:/app/data
    networks: [ai-gateway]
    labels: *watchtower-enabled

  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    restart: unless-stopped
    pull_policy: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "18318:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/cli-proxy-api/config.yaml:/CLIProxyAPI/config.yaml
      - ./data/cli-proxy-api/auths:/root/.cli-proxy-api
      - ./data/cli-proxy-api/logs:/CLIProxyAPI/logs
      - ./data/cli-proxy-api/plugins:/CLIProxyAPI/plugins
    networks: [ai-gateway]
    labels: *watchtower-enabled

  cpa-manager-plus:
    image: seakee/cpa-manager-plus:latest
    container_name: cpa-manager-plus
    restart: unless-stopped
    pull_policy: always
    ports:
      - "18317:18317"
    volumes:
      - ./data/cpa-manager-plus:/data
    networks: [ai-gateway]
    depends_on:
      - cli-proxy-api
    labels: *watchtower-enabled

  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    container_name: agent-infra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks: [ai-gateway]

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower-desktop
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: "desktop-ai"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_TIMEOUT: 60s

networks:
  ai-gateway:
    name: desktop-ai-gateway
